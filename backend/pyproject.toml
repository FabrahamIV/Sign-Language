[project]
name = "signstream-backend"
version = "1.0.0"
description = "SignStream Real-Time Sign Language Translation Backend (FastAPI + PyTorch + MediaPipe)"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
vision = [
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.11",
    "pyarrow>=15.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

